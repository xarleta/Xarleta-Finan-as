name: xarleta_financas

description: Controle financeiro pessoal offline, leve e privado.

publish_to: "none"

version: 2.0.0+7

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  intl: ^0.20.2
  crypto: ^3.0.6
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.2
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0
  flutter_timezone: ^4.1.0
  local_auth: ^2.3.0
  csv: ^6.0.0
  fl_chart: ^0.69.0
  share_plus: 13.0.0
  file_picker: 12.3.0
  sqflite_common_ffi: ^2.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

# Geração dos ícones do aplicativo a partir da imagem oficial fornecida
# (assets/icon/app_icon.png, 1024x1024). O ícone adaptativo do Android usa a
# mesma imagem como frente e um fundo sólido escuro, preservando o rosto
# centralizado e evitando cortes em máscaras circulares/arredondadas.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A1A"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: false
  macos:
    generate: false